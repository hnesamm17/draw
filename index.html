<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>draw</title>
    <style>
      body {
        width: 100vw;
        height: 100vh;
        font-family: sans-serif;
        display: grid;
        grid-template-rows: 80% 20%;
        grid-template-columns: 70% 30%;
        justify-items: center;
        align-items: center;
        justify-content: center;
        align-content: center;
        gap: 20px;
        padding: 20px;
        box-sizing: border-box;
        margin: 0;
        background: linear-gradient(
          to top left,
          rgb(6, 142, 110),
          rgb(255, 81, 0),
          rgb(72, 0, 255)
        );
        background-position: 25% 25%;
        background-size: 200% 200%;
        animation: bgc 15s ease infinite alternate 2s;
      }
      .dv {
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.263);
        border-radius: 20px;
        padding: 20px;
        box-sizing: border-box;
      }

      canvas {
        background-color: rgb(250, 225, 225);
        position: relative;
        width: 90%;
        height: 90%;
        cursor: none;
      }
      .dv:nth-child(3) {
        grid-column: 2/-1;
        grid-row: 1/3;
        display: flex;
        align-items: start;
        justify-content: center;
      }
      .dv:nth-child(2) {
        display: flex;
        justify-content: start;
        align-items: center;
        overflow: scroll;
        scrollbar-width: none;
        gap: 10px;
      }
      .dv:nth-child(2)::-webkit-scrollbar {
        display: none;
      }
      .dv:nth-child(2) button {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: none;
        background-color: rgba(0, 0, 0, 0.405);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .drop {
        position: absolute;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: radial-gradient(red, rgba(252, 96, 96, 0.39));
        top: 5%;
        left: 58%;
      }
      button#active-btn {
        background-color: rgb(250, 252, 251);
      }
      #active-btn svg {
        fill: black;
      }

      .dv:nth-child(3) table {
        width: 60%;
        height: fit-content;
        border-spacing: 30px;
        text-align: center;
      }
      .dv:nth-child(3) table td {
        background-color: rgba(0, 0, 0, 0.514);
        width: 70px;
        height: 70px;
        color: white;
        border-radius: 50% 50%;
        filter: drop-shadow(0px 0px 10px rgb(255, 94, 0));
      }
      input[type="color"] {
        border: none;
        width: 50px;
        height: 50px;
        cursor: pointer;
      }
      input[type="number"] {
        width: 40px;
        height: 25px;
        font-weight: bold;
        text-align: center;
      }
      .dv button.ca {
        background-color: red;
        color: white;
      }
      svg {
        width: 50%;
        height: 50%;
      }
      .exp svg{
        width: 75%;
        height: 75%;
      }
      @keyframes bgc {
        50% {
          background-position: 100% 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="dv">
      <canvas></canvas>
      <div class="drop"></div>
    </div>
    <div class="dv">

    </div>
    <div class="dv">
      <table>
        <tr>
          <td><input type="color" class="color" /></td>
          <td>color</td>
        </tr>
        <tr>
          <td><input type="number" value="1" class="size" /></td>
